goal_id: "1"
goal: "Publish task queue scanning and claim lease protocol for Kiln"
type: development
owner: goal-tracker
provider: github
success_criteria:
  - "Tessera documents task.list as the deterministic queue scanning verb."
  - "Tessera documents a claim/lease verb that safely prevents two workers from owning the same active task."
  - "Protocol schemas and conformance fixtures cover task.list and claim/lease happy path plus active-claim conflict."
  - "Conformance fixtures make claim auth and clock context machine-readable via _auth and _clock."
  - "Claim lease assigned events are replay-safe and distinguish claim fields from ordinary assignment."
  - "GOALS.md and STATUS.md reflect the new active goal and resulting state."
files_in_scope:
  - "GOALS.md"
  - "STATUS.md"
  - "SPEC.md"
  - "TECHNICAL.md"
  - "README.md"
  - "CHANGELOG.md"
  - "conformance/README.md"
  - "conformance/fixtures/*.json"
  - "schemas/resources/task.json"
  - "schemas/verbs/task.list.req.json"
  - "schemas/verbs/task.list.res.json"
  - "schemas/verbs/task.claim.req.json"
  - "schemas/verbs/task.claim.res.json"
